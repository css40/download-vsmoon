<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Imagen para compartir (1200×630)</title>
<!-- Ábrelo en el navegador a tamaño real y toma una captura de 1200×630 → guárdala como img/compartir.png -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;font-family:"Nunito",system-ui,sans-serif;color:#ebe8e1;background:#1c1d21;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:30px 30px;
    display:grid;grid-template-columns:1fr 470px;align-items:center;padding:0 70px;border:10px solid #0f1012}
  .chip{display:inline-block;font:14px/1 "Press Start 2P",monospace;color:#15161a;background:#8d9dca;border:3px solid #0f1012;box-shadow:4px 4px 0 #0f1012;padding:12px 14px;border-radius:6px;margin-bottom:34px}
  h1{margin:0;font-size:132px;line-height:.95;font-weight:900;letter-spacing:-3px}
  h1 b{color:#8d9dca}
  p{margin:30px 0 0;font-size:34px;font-weight:700;line-height:1.3;color:#a29f98;max-width:600px}
  .foto{width:440px;height:440px;position:relative;justify-self:center}
  .foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2}
  .foto::before{content:"";position:absolute;left:8%;right:8%;bottom:2%;height:26px;border-radius:50%;background:#0f1012;opacity:.55}
  .marco{position:absolute;inset:0;display:grid;place-items:center;text-align:center;border:4px dashed #5a5e6b;border-radius:18px;font:16px/1.8 "Press Start 2P",monospace;color:#5a5e6b;padding:30px}
</style></head>
<body>
  <div>
    <span class="chip">V1.9.1 · BETA EDUCATIVA</span>
    <h1>vs<b>MOON</b></h1>
    <p>El editor con Mr. Pixel, hecho por un estudiante para estudiantes.</p>
  </div>
  <div class="foto">
    <div class="marco">PON A<br>MR. PIXEL</div>
    <img src="img/compartir.png" alt="" onerror="this.remove()">
  </div>
  <script>document.querySelector('.foto img').addEventListener('load',()=>document.querySelector('.marco').remove())</script>
</body></html>
